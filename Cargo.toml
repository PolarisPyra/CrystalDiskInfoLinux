[package]
name = "crystaldiskinfo-linux"
version = "0.1.0"
edition = "2024"
description = "Linux Rust port of CrystalDiskInfo"
license = "MIT"

[[bin]]
name = "crystaldiskinfo-linux"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.10" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
