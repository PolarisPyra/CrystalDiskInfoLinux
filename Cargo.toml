[package]
name = "crystaldiskinfo-linux"
version = "0.1.0"
edition = "2024"
description = "Linux Rust port of CrystalDiskInfo"
license = "MIT"

[[bin]]
name = "crystaldiskinfo-linux"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "clipboard", "links"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18.1"
